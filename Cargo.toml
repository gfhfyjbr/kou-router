[package]
name = "kou-router"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.1", features = ["macros", "json", "multipart"] }
bytes = "1"
argon2 = "0.5"
base64 = "0.22"
hmac = "0.12"
jsonwebtoken = "9"
rand = "0.9"
sha2 = "0.10"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "sync", "fs"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
serial_test = "3"
